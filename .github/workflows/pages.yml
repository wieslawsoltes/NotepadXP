name: Test and deploy Notepad XP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble original source on first import
        id: bootstrap
        shell: bash
        run: |
          if [ -f .bootstrap/manifest.json ]; then
            node .bootstrap/import.mjs
            echo "imported=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check JavaScript syntax
        shell: bash
        run: find src mcp tests tools -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Build standalone HTML
        run: npm run build
      - name: Run automated tests
        run: npm test
      - name: Verify original standalone build
        if: steps.bootstrap.outputs.imported == 'true'
        run: echo '44e40442a9369f3b25f8c36081dee70492e05feb92c59f23d2eba577b887f401  NotepadXP.html' | sha256sum --check
      - name: Commit assembled source and standalone artifact
        if: steps.bootstrap.outputs.imported == 'true'
        shell: bash
        run: |
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.mjs src/style.css NotepadXP.html .bootstrap
          git commit -m "Complete verified source import and build standalone Notepad XP"
          git push origin HEAD:main
      - name: Stage static website
        shell: bash
        run: |
          mkdir -p _site
          cp index.html NotepadXP.html .nojekyll _site/
          cp -R src assets _site/
          printf '{"commit":"%s"}\n' "$(git rev-parse HEAD)" > _site/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
