name: Test and deploy Notepad XP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: find src mcp tests tools examples -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Build standalone HTML
        run: npm run build
      - name: Run automated tests
        run: npm test
      - name: Stage static website
        shell: bash
        run: |
          mkdir -p _site
          cp index.html NotepadXP.html .nojekyll _site/
          cp -R src assets _site/
          printf '{"commit":"%s"}\n' "$(git rev-parse HEAD)" > _site/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
